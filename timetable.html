<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentVerse — Weekly Timetable</title>
    <meta name="description" content="Interactive weekly class timetable with customizable slots, professor info and color-coded course categories.">
    <meta name="theme-color" content="#03050c">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/timetable.css">
</head>
<body>

<!-- Page Loader -->
<div id="pageLoader">
    <div class="loader-content">
        <div class="loader-logo">TIMETABLE</div>
        <div class="loader-line"><div class="loader-progress"></div></div>
    </div>
</div>

<div class="app-layout">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <a href="dashboard.html" class="logo-container">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </div>
            <div class="logo-text">StudentVerse</div>
        </a>

        <div class="nav-section">
            <div class="nav-title">WORKSPACE</div>
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>
            <a href="academics.html" class="nav-item">
                <span class="nav-icon">▣</span>
                <span>Academics</span>
            </a>
            <a href="timetable.html" class="nav-item active">
                <span class="nav-icon">▦</span>
                <span>Timetable</span>
            </a>
            <a href="goals.html" class="nav-item">
                <span class="nav-icon">◎</span>
                <span>Goals</span>
            </a>
            <a href="wellness.html" class="nav-item">
                <span class="nav-icon">◌</span>
                <span>Wellness</span>
            </a>

            <div class="nav-title">ACCOUNT</div>
            <a href="profile.html" class="nav-item">
                <span class="nav-icon">○</span>
                <span>Profile & ID</span>
            </a>
        </div>

        <div class="sidebar-bottom">
            <a href="profile.html" class="profile-mini">
                <div class="avatar-mini" id="sidebarProfileAvatar">⚡</div>
                <div class="profile-mini-info">
                    <div class="profile-mini-name" id="sidebarProfileName">Alex Mercer</div>
                    <div class="profile-mini-role" id="sidebarProfileRole">Computer Science</div>
                </div>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>

            <button class="search-command-btn">
                <span>🔍</span>
                <span class="search-command-text">Quick Search or Action...</span>
                <span class="kbd-shortcut">Ctrl + K</span>
            </button>

            <div class="topbar-actions">
                <div class="topbar-live-clock" id="topbarClock">--:--:--</div>
                <a href="profile.html" class="topbar-btn" title="Profile">👤</a>
            </div>
        </header>

        <div class="timetable-header">
            <div>
                <h1 class="hero-title">Weekly Schedule ▦</h1>
                <p class="hero-subtitle">Click any time cell below to add, edit, or customize class locations and professor notes.</p>
            </div>

            <!-- Day Filters -->
            <div class="day-filters">
                <button class="day-btn active" data-day="ALL">ALL DAYS</button>
                <button class="day-btn" data-day="MON">MON</button>
                <button class="day-btn" data-day="TUE">TUE</button>
                <button class="day-btn" data-day="WED">WED</button>
                <button class="day-btn" data-day="THU">THU</button>
                <button class="day-btn" data-day="FRI">FRI</button>
            </div>
        </div>

        <!-- Timetable Grid -->
        <div class="timetable-grid-wrapper">
            <div class="timetable-matrix" id="timetableMatrix">
                <!-- Dynamically rendered by timetable.js -->
            </div>
        </div>
    </main>
</div>

<!-- Slot Edit / Add Modal -->
<div class="modal-backdrop" id="slotModal">
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h3 class="modal-title">Edit Schedule Slot</h3>
                <span style="font-size:12px; color:var(--cyan);" id="slotModalTimeLabel">Monday at 09:00</span>
            </div>
            <button class="modal-close" id="closeSlotModalBtn">✕</button>
        </div>

        <div class="form-group">
            <label class="form-label">Subject / Lecture Title</label>
            <input type="text" class="form-input" id="slotSubjectInput" placeholder="e.g. Data Structures & Algorithms">
        </div>

        <div class="form-group">
            <label class="form-label">Room / Hall Location</label>
            <input type="text" class="form-input" id="slotRoomInput" placeholder="e.g. Lab 304 or Lecture Hall B">
        </div>

        <div class="form-group">
            <label class="form-label">Professor / Instructor</label>
            <input type="text" class="form-input" id="slotProfInput" placeholder="e.g. Dr. Elena Vance">
        </div>

        <div class="form-group">
            <label class="form-label">Color Accent Theme</label>
            <select class="form-select" id="slotColorInput">
                <option value="cyan">Cyan Neon (Core)</option>
                <option value="purple">Purple Celestial</option>
                <option value="gold">Golden Sun</option>
                <option value="emerald">Emerald Lab</option>
            </select>
        </div>

        <div class="modal-footer" style="justify-content: space-between;">
            <button class="btn btn-danger" id="deleteSlotBtn">Clear Slot</button>
            <button class="btn btn-primary" id="saveSlotBtn">Save Class</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
<script src="js/timetable.js"></script>
</body>
</html>
